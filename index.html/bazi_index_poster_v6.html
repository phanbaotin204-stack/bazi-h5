<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>好运八字排盘</title>
  <style>
    :root{--bg:#f7efe4;--card:#fffaf3;--text:#2c2118;--muted:#7d6b5b;--primary:#9b4d24;--primary-dark:#783818;--line:#ead9c8;--soft:#f2e3d1;}
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at top left,rgba(214,153,94,.25),transparent 35%),linear-gradient(180deg,#f8eadb 0%,#f7efe4 42%,#fffaf3 100%);color:var(--text);min-height:100vh}.app{width:min(980px,100%);margin:0 auto;padding:36px 16px 48px}.hero{text-align:center;padding:8px 8px 22px}.badge{display:inline-flex;padding:6px 12px;border:1px solid rgba(155,77,36,.22);border-radius:999px;color:var(--primary);background:rgba(255,250,243,.72);font-size:13px;margin-bottom:12px}h1{margin:0;font-size:clamp(30px,8vw,54px);letter-spacing:2px;line-height:1.08}.subtitle{margin:14px auto 0;max-width:680px;color:var(--muted);line-height:1.8;font-size:15px}.grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px;align-items:start}.card{background:rgba(255,250,243,.88);border:1px solid rgba(234,217,200,.95);border-radius:24px;box-shadow:0 18px 50px rgba(72,39,18,.08);overflow:hidden}.card-header{padding:18px 20px;border-bottom:1px solid var(--line)}.card-title{margin:0;font-size:18px;font-weight:800}.card-desc{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.card-body{padding:20px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:14px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#4d3725}input,select{width:100%;border:1px solid var(--line);background:#fffdf9;color:var(--text);border-radius:14px;padding:12px 13px;font-size:15px;outline:none}.btns{display:grid;grid-template-columns:1fr .55fr;gap:10px;margin-top:6px}button{border:0;border-radius:16px;padding:13px 14px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 12px 24px rgba(155,77,36,.22)}.secondary,.small-btn{background:var(--soft);color:var(--primary-dark)}.tip{margin-top:14px;padding:12px 13px;border-radius:16px;background:rgba(242,227,209,.62);color:var(--muted);font-size:13px;line-height:1.7}.empty{min-height:380px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:34px}.empty-icon{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--primary);font-size:32px;margin:0 auto 16px}.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.pillar{border:1px solid var(--line);border-radius:20px;background:#fffdf9;text-align:center;padding:14px 8px}.pillar-name{color:var(--muted);font-size:12px;margin-bottom:7px}.gz{font-size:26px;font-weight:900;line-height:1.1;color:var(--primary-dark)}.element{margin-top:8px;font-size:12px;color:var(--muted)}.section{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.section h3{margin:0 0 10px;font-size:16px}.five-list{display:grid;gap:9px}.five-item{display:grid;grid-template-columns:34px 1fr 34px;gap:10px;align-items:center;font-size:14px}.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#c87a3a,#9b4d24);border-radius:999px}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{padding:7px 10px;border-radius:999px;background:var(--soft);color:#5d3a20;font-size:13px;font-weight:700}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.detail-card{border:1px solid var(--line);border-radius:16px;background:#fffdf9;padding:12px;font-size:13px;line-height:1.7}.detail-card b{display:block;color:var(--primary-dark);margin-bottom:4px;font-size:14px}.detail-card span{color:var(--muted)}.luck-note{margin:0 0 10px;color:var(--muted);font-size:13px;line-height:1.7}.luck-grid,.flow-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.luck-card,.flow-card{border:1px solid var(--line);border-radius:16px;background:#fffdf9;padding:12px;text-align:center}.luck-age,.flow-year{font-size:12px;color:var(--muted);margin-bottom:5px}.luck-gz,.flow-gz{font-size:22px;font-weight:900;color:var(--primary-dark);line-height:1.1}.luck-sub,.flow-sub{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}.flow-tag{display:inline-block;margin-top:6px;padding:4px 8px;border-radius:999px;background:var(--soft);color:#5d3a20;font-size:12px;font-weight:700}.report{display:grid;gap:10px}.report-block{padding:13px 14px;border-radius:17px;background:#fffdf9;border:1px solid var(--line);line-height:1.75;font-size:14px;color:#4b392b}.report-block strong{color:var(--primary-dark)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.small-btn{padding:10px 12px;font-size:13px;border-radius:12px}.poster-modal{position:fixed;inset:0;background:rgba(44,33,24,.58);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.poster-modal.show{display:flex}.poster-box{width:min(420px,100%);max-height:92vh;overflow:auto;background:#fffaf3;border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 80px rgba(44,33,24,.25);padding:16px}.poster-img{width:100%;display:block;border-radius:18px;border:1px solid var(--line);background:#fff}.poster-tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.poster-tools a,.poster-tools button{display:block;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:800;cursor:pointer}.poster-tools a{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff}.poster-tools button{background:var(--soft);color:var(--primary-dark)}.poster-hint{margin:10px 2px 0;color:var(--muted);font-size:12px;line-height:1.6;text-align:center}.poster-canvas{display:none}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;background:rgba(44,33,24,.92);color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;transition:.25s;pointer-events:none;z-index:10}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.disclaimer{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.7;text-align:center}@media(max-width:820px){.grid{grid-template-columns:1fr}.pillars{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:repeat(2,1fr)}.luck-grid,.flow-grid{grid-template-columns:repeat(2,1fr)}.hero{padding-top:16px}}@media(max-width:460px){.form-row,.btns{grid-template-columns:1fr}.card-body{padding:16px}.card-header{padding:16px}.gz{font-size:23px}.detail-grid,.luck-grid,.flow-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="badge">传统文化命盘体验</div>
      <h1>好运八字排盘</h1>
      <p class="subtitle">输入出生信息，生成专属四柱八字、五行分布、大运流年和命理参考报告，一键生成适合保存与分享的命盘海报。</p>
    </section>
    <section class="grid">
      <div class="card">
        <div class="card-header"><h2 class="card-title">出生信息</h2><p class="card-desc">填写信息后，可生成命盘、报告与分享海报。</p></div>
        <div class="card-body">
          <div class="form-row"><div class="field"><label for="name">姓名 / 昵称</label><input id="name" placeholder="例如：张三"></div><div class="field"><label for="gender">性别</label><select id="gender"><option value="男">男</option><option value="女">女</option><option value="未知">不透露</option></select></div></div>
          <div class="field"><label for="birthDate">出生日期</label><input id="birthDate" type="date"></div>
          <div class="field"><label for="birthTime">出生时间</label><input id="birthTime" type="time" value="12:00"></div>
          <div class="field"><label for="city">出生地</label><input id="city" placeholder="例如：郑州"></div>
          <div class="btns"><button class="primary" onclick="generateChart()">立即排盘</button><button class="secondary" onclick="fillDemo()">示例</button></div>
          <div class="tip">出生时间不确定时，可先选择大致时辰体验；结果仅供传统文化娱乐参考，请理性看待。</div>
        </div>
      </div>
      <div class="card" id="resultCard"><div class="empty"><div><div class="empty-icon">八</div><h2>等待排盘</h2><p>填写出生信息后，结果会显示在这里。</p></div></div></div>
    </section>
    <p class="disclaimer">说明：本工具用于传统文化娱乐与产品原型演示，不应作为医疗、投资、婚恋或重大人生决策依据。</p>
  </main>
  <div class="toast" id="toast"></div>
  <div class="poster-modal" id="posterModal">
    <div class="poster-box">
      <img class="poster-img" id="posterPreview" alt="命盘海报预览">
      <div class="poster-tools">
        <a id="posterDownload" download="好运八字海报.png">保存海报 / 长按图片</a>
        <button type="button" onclick="closePoster()">关闭</button>
      </div>
      <p class="poster-hint">微信内可长按上方图片保存到相册；如按钮无效，可使用长按保存或截图保存。</p>
    </div>
  </div>
  <canvas class="poster-canvas" id="posterCanvas" width="750" height="1100"></canvas>
  <script>
    var stems = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
    var branches = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
    var stemElements = {"甲":"木","乙":"木","丙":"火","丁":"火","戊":"土","己":"土","庚":"金","辛":"金","壬":"水","癸":"水"};
    var branchElements = {"子":"水","丑":"土","寅":"木","卯":"木","辰":"土","巳":"火","午":"火","未":"土","申":"金","酉":"金","戌":"土","亥":"水"};
    var yinYang = {"甲":"阳","乙":"阴","丙":"阳","丁":"阴","戊":"阳","己":"阴","庚":"阳","辛":"阴","壬":"阳","癸":"阴"};
    var elementCycle = ["木","火","土","金","水"];
    var hiddenStemMap = {"子":["癸"],"丑":["己","癸","辛"],"寅":["甲","丙","戊"],"卯":["乙"],"辰":["戊","乙","癸"],"巳":["丙","庚","戊"],"午":["丁","己"],"未":["己","丁","乙"],"申":["庚","壬","戊"],"酉":["辛"],"戌":["戊","辛","丁"],"亥":["壬","甲"]};
    var naYinMap = {"甲子":"海中金","乙丑":"海中金","丙寅":"炉中火","丁卯":"炉中火","戊辰":"大林木","己巳":"大林木","庚午":"路旁土","辛未":"路旁土","壬申":"剑锋金","癸酉":"剑锋金","甲戌":"山头火","乙亥":"山头火","丙子":"涧下水","丁丑":"涧下水","戊寅":"城头土","己卯":"城头土","庚辰":"白蜡金","辛巳":"白蜡金","壬午":"杨柳木","癸未":"杨柳木","甲申":"泉中水","乙酉":"泉中水","丙戌":"屋上土","丁亥":"屋上土","戊子":"霹雳火","己丑":"霹雳火","庚寅":"松柏木","辛卯":"松柏木","壬辰":"长流水","癸巳":"长流水","甲午":"沙中金","乙未":"沙中金","丙申":"山下火","丁酉":"山下火","戊戌":"平地木","己亥":"平地木","庚子":"壁上土","辛丑":"壁上土","壬寅":"金箔金","癸卯":"金箔金","甲辰":"佛灯火","乙巳":"佛灯火","丙午":"天河水","丁未":"天河水","戊申":"大驿土","己酉":"大驿土","庚戌":"钗钏金","辛亥":"钗钏金","壬子":"桑柘木","癸丑":"桑柘木","甲寅":"大溪水","乙卯":"大溪水","丙辰":"沙中土","丁巳":"沙中土","戊午":"天上火","己未":"天上火","庚申":"石榴木","辛酉":"石榴木","壬戌":"大海水","癸亥":"大海水"};
    var changShengStart = {"甲":"亥","乙":"午","丙":"寅","丁":"酉","戊":"寅","己":"酉","庚":"巳","辛":"子","壬":"申","癸":"卯"};
    var changShengNames = ["长生","沐浴","冠带","临官","帝旺","衰","病","死","墓","绝","胎","养"];
    var reverseStems = {"乙":true,"丁":true,"己":true,"辛":true,"癸":true};

    function pad(n){return String(n).padStart(2,"0");}
    function htmlEscape(str){return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");}
    function showToast(msg){var t=document.getElementById("toast");t.textContent=msg;t.className="toast show";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(function(){t.className="toast";},1800);}
    function getGanZhi(index){var i=((index%60)+60)%60;return stems[i%10]+branches[i%12];}
    function getYearPillar(date){var y=date.getFullYear();var lc=new Date(y,1,4,0,0,0);if(date<lc)y--;return getGanZhi(y-4);}
    function getSolarMonthIndex(date){var m=date.getMonth()+1;var d=date.getDate();var md=m*100+d;if(md>=204&&md<306)return 0;if(md>=306&&md<405)return 1;if(md>=405&&md<506)return 2;if(md>=506&&md<606)return 3;if(md>=606&&md<707)return 4;if(md>=707&&md<808)return 5;if(md>=808&&md<908)return 6;if(md>=908&&md<1008)return 7;if(md>=1008&&md<1107)return 8;if(md>=1107&&md<1207)return 9;if(md>=1207||md<106)return 10;return 11;}
    function getMonthPillar(date,yearPillar){var mi=getSolarMonthIndex(date);var ys=stems.indexOf(yearPillar.charAt(0));var first=((ys%5)*2+2)%10;return stems[(first+mi)%10]+branches[(mi+2)%12];}
    function dayDiffFrom20000101(date){var base=Date.UTC(2000,0,1);var cur=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate());return Math.floor((cur-base)/86400000);}
    function getDayPillar(date){var refIndex=54;return getGanZhi(refIndex+dayDiffFrom20000101(date));}
    function getHourBranchIndex(hour){if(hour===23||hour===0)return 0;return Math.floor((hour+1)/2)%12;}
    function getHourPillar(dayPillar,hour){var bi=getHourBranchIndex(hour);var ds=stems.indexOf(dayPillar.charAt(0));var zi=(ds%5)*2;return stems[(zi+bi)%10]+branches[bi];}
    function countElements(pillars){var c={"木":0,"火":0,"土":0,"金":0,"水":0};for(var i=0;i<pillars.length;i++){var gz=pillars[i];c[stemElements[gz.charAt(0)]]++;c[branchElements[gz.charAt(1)]]++;}return c;}
    function relationToDayMaster(dayStem,targetStem){var dm=stemElements[dayStem];var tg=stemElements[targetStem];var same=yinYang[dayStem]===yinYang[targetStem];var di=elementCycle.indexOf(dm);var ti=elementCycle.indexOf(tg);if(dm===tg)return same?"比肩":"劫财";if((di+1)%5===ti)return same?"食神":"伤官";if((di+2)%5===ti)return same?"偏财":"正财";if((di+3)%5===ti)return same?"七杀":"正官";if((di+4)%5===ti)return same?"偏印":"正印";return "";}
    function getChangSheng(dayStem,branch){var start=changShengStart[dayStem];var si=branches.indexOf(start);var bi=branches.indexOf(branch);var idx;if(reverseStems[dayStem]){idx=(si-bi+12)%12;}else{idx=(bi-si+12)%12;}return changShengNames[idx];}
    function getPillarDetails(pillars,dayStem){var arr=[];for(var i=0;i<pillars.length;i++){var gz=pillars[i];var br=gz.charAt(1);arr.push({gz:gz,hidden:hiddenStemMap[br]||[],nayin:naYinMap[gz]||"",cs:getChangSheng(dayStem,br)});}return arr;}
    function getGanZhiIndex(gz){for(var i=0;i<60;i++){if(getGanZhi(i)===gz)return i;}return 0;}
    function isYangStem(stem){return ["甲","丙","戊","庚","壬"].indexOf(stem)>=0;}
    function getLuckDirection(gender,yearPillar){var yang=isYangStem(yearPillar.charAt(0));if(gender==="男")return{forward:yang,text:yang?"男命阳年，顺排大运":"男命阴年，逆排大运"};if(gender==="女")return{forward:!yang,text:yang?"女命阳年，逆排大运":"女命阴年，顺排大运"};return{forward:true,text:"性别未知，暂按顺排演示"};}
    function getJieQiBoundaries(year){var defs=[{m:1,d:6,n:"小寒"},{m:2,d:4,n:"立春"},{m:3,d:6,n:"惊蛰"},{m:4,d:5,n:"清明"},{m:5,d:6,n:"立夏"},{m:6,d:6,n:"芒种"},{m:7,d:7,n:"小暑"},{m:8,d:8,n:"立秋"},{m:9,d:8,n:"白露"},{m:10,d:8,n:"寒露"},{m:11,d:7,n:"立冬"},{m:12,d:7,n:"大雪"}];var arr=[];for(var y=year-1;y<=year+1;y++){for(var i=0;i<defs.length;i++){arr.push({name:defs[i].n,date:new Date(y,defs[i].m-1,defs[i].d,0,0,0)});}}arr.sort(function(a,b){return a.date-b.date;});return arr;}
    function getLuckStart(date,forward){var list=getJieQiBoundaries(date.getFullYear());var target=list[0];if(forward){for(var i=0;i<list.length;i++){if(list[i].date>date){target=list[i];break;}}}else{for(var j=list.length-1;j>=0;j--){if(list[j].date<date){target=list[j];break;}}}var days=Math.abs(target.date-date)/86400000;var totalMonths=Math.max(1,Math.round(days*4));var years=Math.floor(totalMonths/12);var months=totalMonths%12;return{termName:target.name,days:days,years:years,months:months,text:years+"岁"+(months?months+"个月":"")+"起运"};}
    function getLuckPillars(data){var dateParts=data.birthDate.split("-");var timeParts=(data.birthTime||"12:00").split(":");var birthDate=new Date(Number(dateParts[0]),Number(dateParts[1])-1,Number(dateParts[2]),Number(timeParts[0]),Number(timeParts[1]||0),0);var dir=getLuckDirection(data.gender,data.year);var start=getLuckStart(birthDate,dir.forward);var monthIndex=getGanZhiIndex(data.month);var birthYear=Number(dateParts[0]);var list=[];for(var i=0;i<10;i++){var idx=monthIndex+(dir.forward?(i+1):-(i+1));var gz=getGanZhi(idx);var startAge=start.years+i*10;list.push({gz:gz,ageText:startAge+"-"+(startAge+9)+"岁",startYear:birthYear+startAge,god:relationToDayMaster(data.day.charAt(0),gz.charAt(0))});}return{directionText:dir.text,startText:start.text,termName:start.termName,items:list};}
    function getCurrentLuckForYear(luck,year){if(!luck||!luck.items)return null;var current=luck.items[0];for(var i=0;i<luck.items.length;i++){var item=luck.items[i];if(year>=item.startYear){current=item;}}return current;}
    function getFlowAdvice(god){if(god==="正财"||god==="偏财")return "财星年，适合关注收入、资源和实际回报。";if(god==="正官"||god==="七杀")return "官杀年，适合重视规则、职位、压力和责任。";if(god==="正印"||god==="偏印")return "印星年，适合学习、考证、贵人和长期积累。";if(god==="食神"||god==="伤官")return "食伤年，适合表达、作品、传播和技能输出。";if(god==="比肩"||god==="劫财")return "比劫年，适合合作、竞争、人脉和主动行动。";return "此年可结合大运一起综合参考。";}
    function getFlowYears(data){var now=new Date();var startYear=now.getFullYear();var birthYear=Number(data.birthDate.split("-")[0]);var arr=[];for(var i=0;i<10;i++){var y=startYear+i;var gz=getGanZhi(y-4);var god=relationToDayMaster(data.day.charAt(0),gz.charAt(0));var luck=getCurrentLuckForYear(data.luck,y);arr.push({year:y,gz:gz,age:y-birthYear,god:god,luck:luck?luck.gz:"",advice:getFlowAdvice(god)});}return arr;}
    function getStrength(counts,dayElement){var support={"木":["木","水"],"火":["火","木"],"土":["土","火"],"金":["金","土"],"水":["水","金"]};var total=0;for(var i=0;i<support[dayElement].length;i++){total+=counts[support[dayElement][i]];}if(total>=5)return{label:"偏旺",desc:"命局中扶助日主的力量较多，适合在表达、执行和主导性上发挥优势，但也要注意避免过度固执。"};if(total>=3)return{label:"中和",desc:"命局力量相对平衡，做事可进可守，适合根据阶段环境灵活调整方向。"};return{label:"偏弱",desc:"命局中扶助日主的力量偏少，更适合借助资源、团队、学习和稳定规划来增强底气。"};}
    function getElementAdvice(counts){var names=["木","火","土","金","水"];var weak=names[0],strong=names[0];for(var i=1;i<names.length;i++){if(counts[names[i]]<counts[weak])weak=names[i];if(counts[names[i]]>counts[strong])strong=names[i];}var advice={"木":"可多关注成长、学习、规划、审美与长期主义。","火":"可多关注表达、传播、热情、行动力与曝光机会。","土":"可多关注稳定、信用、积累、组织能力与落地执行。","金":"可多关注规则、效率、专业技能、判断力与边界感。","水":"可多关注沟通、流动、信息、复盘与适应变化。"};return{weak:weak,strong:strong,text:"当前五行中「"+strong+"」相对突出，「"+weak+"」相对不足。建议补足「"+weak+"」对应的行为能量："+advice[weak]};}
    function buildReport(data){
      var ds=data.day.charAt(0);
      var de=stemElements[ds];
      var str=getStrength(data.counts,de);
      var adv=getElementAdvice(data.counts);
      var p=[data.year,data.month,data.day,data.hour];
      var gods=[];
      for(var i=0;i<p.length;i++){gods.push(relationToDayMaster(ds,p[i].charAt(0)));}
      var owner=data.name?data.name+"的":"此命主的";
      return{
        dayStem:ds,
        dayElement:de,
        strength:str,
        advice:adv,
        tenGods:gods,
        summary:owner+"日主为"+ds+de+"，整体呈「"+str.label+"」格局。"+str.desc,

    function drawRoundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
    function wrapPosterText(ctx,text,x,y,maxWidth,lineHeight,maxLines){var words=String(text).split('');var line='';var lines=[];for(var i=0;i<words.length;i++){var test=line+words[i];if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=words[i];if(lines.length>=maxLines-1)break;}else{line=test;}}if(line&&lines.length<maxLines){lines.push(line);}for(var j=0;j<lines.length;j++){var out=lines[j];if(j===maxLines-1&&words.join('').length>lines.join('').length){out=out.replace(/。?$/,'')+'…';}ctx.fillText(out,x,y+j*lineHeight);}return y+lines.length*lineHeight;}

    function clearResult(){localStorage.removeItem("bazi_last_result");document.getElementById("resultCard").innerHTML="<div class='empty'><div><div class='empty-icon'>八</div><h2>等待排盘</h2><p>填写出生信息后，结果会显示在这里。</p></div></div>";showToast("已清空");}
    function resetForNewChart(){clearResult();var nameInput=document.getElementById("name");if(nameInput){nameInput.focus();}try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){window.scrollTo(0,0);}showToast("可以重新填写信息");}
    function fillDemo(){document.getElementById("name").value="张三";document.getElementById("gender").value="男";document.getElementById("birthDate").value="1996-08-18";document.getElementById("birthTime").value="09:30";document.getElementById("city").value="郑州";generateChart();}
    window.addEventListener("DOMContentLoaded",function(){
      var today=new Date();
      var birthDateInput=document.getElementById("birthDate");
      birthDateInput.max=today.getFullYear()+"-"+pad(today.getMonth()+1)+"-"+pad(today.getDate());
      try{
        var saved=localStorage.getItem("bazi_last_result");
        if(saved){
          var data=JSON.parse(saved);
          document.getElementById("name").value=data.name||"";
          document.getElementById("gender").value=data.gender||"未知";
          document.getElementById("birthDate").value=data.birthDate||"";
          document.getElementById("birthTime").value=data.birthTime||"12:00";
          document.getElementById("city").value=data.city||"";
          var pillars=[data.year,data.month,data.day,data.hour];
          if(data.year&&data.month&&data.day&&data.hour){
            data.counts=countElements(pillars);
            data.report=buildReport(data);
            data.details=getPillarDetails(pillars,data.day.charAt(0));
            data.luck=getLuckPillars(data);
            data.flowYears=getFlowYears(data);
            renderResult(data);
          }
        }
      }catch(e){
        localStorage.removeItem("bazi_last_result");
      }
    });
  </script>
</body>
</html>
